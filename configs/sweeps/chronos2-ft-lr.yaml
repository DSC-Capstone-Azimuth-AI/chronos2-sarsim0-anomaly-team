# Example W&B sweep: fine-tune learning rate x SarSim0 seasonal range, short budget.
#   wandb sweep configs/sweeps/chronos2-ft-lr.yaml       # prints a sweep id
#   wandb agent <entity>/sarsim-fm/<sweep id>            # run on each GPU machine
#
# The agent appends each sampled value as `key.path=value`, which `sfm train` applies like --set.
# Optimize on held-out *simulated* sets only: M4 is the real zero-shot test, so it is left out
# of eval here to keep it from steering model selection.
program: src/sarsim_fm/cli.py
project: sarsim-fm
entity: chewycrunch-ucsd
name: chronos2-ft-lr
method: random
run_cap: 12
metric:
  name: eval/sim_ood_season/wql
  goal: minimize
parameters:
  train.learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-4
  data.sarsim.s_range:
    values: [[0, 24], [0, 52]]
command:
  - uv
  - run
  - sfm
  - train
  - configs/train/chronos2-ft-5k.yaml
  - ${args_no_hyphens}       # must come right after the config path
  - --set
  - name=chronos2-ft-1k-sweep-lr
  - --set
  - train.max_steps=1000
  - --set
  - eval.datasets=[sim_iid,sim_ood_season]
