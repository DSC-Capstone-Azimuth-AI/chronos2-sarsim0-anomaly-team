# Single-GPU fine-tune. Effective batch 64 x 4 = 256 series per optimizer step.
# RTX 3070 Ti (8 GB, bf16): batch 64 peaks at ~3.8 GB; ~1.3 s/optimizer step → 5000 steps ≈ 2 h.
inherit: _base-chronos2.yaml
name: chronos2-ft-gpu

data:
  batch_size: 64
  num_workers: 2            # SarSim0 generation is ~25% of a step; workers hide it

train:
  max_steps: 5000
  learning_rate: 1.0e-5
  warmup_steps: 200
  grad_accum: 4
  save_steps: 1000

runtime:
  device: cuda
