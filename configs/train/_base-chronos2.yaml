# Shared defaults for Chronos-2 runs. Other configs `inherit:` this and override fields.
# Run names follow docs/naming.md: <model>-<init>-<steps>[-<what's different>].

model:
  type: chronos2
  base: amazon/chronos-2
  init: pretrained          # pretrained = fine-tune; scratch = same architecture, random weights

data:
  context_length: 512
  prediction_length: 18
  batch_size: 8             # series per micro-batch (SarSim0 builds the batch itself)
  seed: 42
  num_workers: 0            # >0 generates SarSim0 batches in parallel; worker i uses seed + i
  sarsim: {}                # SarSimConfig overrides, merged over SARSIM_DEFAULTS

train:
  max_steps: 1000
  learning_rate: 1.0e-5
  lr_scheduler: linear
  warmup_steps: 0
  grad_accum: 1
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 500

runtime:
  device: auto              # auto | cpu | cuda | cuda:N | mps; CLI --device wins
  precision: auto           # auto (bf16 on supporting GPUs) | bf16 | fp32

eval:
  # m4_quarterly = real-data validation (model selection); m4_monthly = zero-shot test. Missing sets are skipped.
  datasets: [sim_iid, sim_ood_season, m4_quarterly, m4_monthly]
  batch_size: 64

wandb:
  enabled: false            # true logs to W&B (needs `uv sync --extra wandb` + `wandb login`)
  group: null               # experiment question this run answers, e.g. sarsim-season-ablation
  tags: []                  # model.type, model.init and device are added automatically
  # project / entity default to sarsim-fm / chewycrunch-ucsd (src/sarsim_fm/tracking.py);
  # WANDB_PROJECT / WANDB_ENTITY env vars override them

hub:
  enabled: false            # true uploads checkpoint-final + run metadata after train and eval (`sfm push` by hand)
  org: azimuth-anomaly-detection   # repo is <org>/<name>; needs `hf auth login` with a write token
  repo: null                # full repo id, overriding <org>/<name>
  private: true
  overwrite: false          # false refuses to upload into an existing repo (checked before training)
