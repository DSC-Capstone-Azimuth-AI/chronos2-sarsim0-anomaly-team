# Fine-tune matched to chronos2-ft-5k: same data, seed, effective batch (256), steps, LR and schedule.
# PatchTST-FM is ~385M parameters (~3x Chronos-2): AdamW alone needs ~6 GB, so this will not fit an
# 8 GB card. Micro-batch 16 x 16 accumulation keeps the effective batch at 256; check memory with
#   uv run sfm check --config configs/train/patchtst-fm-ft-5k.yaml
# and lower data.batch_size (raising train.grad_accum to match) if it runs out.
inherit: _base-patchtst-fm.yaml
name: patchtst-fm-ft-5k

data:
  batch_size: 16
  num_workers: 2

train:
  max_steps: 5000
  learning_rate: 1.0e-5
  warmup_steps: 200
  grad_accum: 16
  save_steps: 1000

runtime:
  device: cuda
